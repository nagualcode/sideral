[package]
name = "sideral"
version = "0.1.2"
edition = "2024"
description = "Sideral: a drifting memory station after the SOMA COSMOS, rebuilt from its firmware"
authors = ["Jardim Sonoro", "nagualcode"]
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "sideral-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "sideral-render"
path = "src/bin/render.rs"

[features]
default = ["clap", "vst3", "au", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]
# Flags any allocation the DSP makes on the audio thread in `process`.
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
truce-gui = { version = "6.3" }
truce-egui = { version = "6.3" }
egui = { version = "0.34" }
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-au = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.shell]
inherits = "release"
